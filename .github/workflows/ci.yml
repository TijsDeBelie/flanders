name: CI
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core (tests + wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      # Tests do not need fat LTO / one codegen unit; that only slows the compile. The shipped wasm build below keeps the real profile.
      - run: cargo test --release -p game-core
        env: { CARGO_PROFILE_RELEASE_LTO: 'false', CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16' }
      - run: cargo build --release -p game-core --target wasm32-unknown-unknown

  core-overflow:
    name: Rust core (hostile-input fuzz, overflow checks on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: overflow }
      - name: Hostile-input fuzz test with integer overflow checks on (release builds wrap silently; this finds the wraps)
        run: cargo test --release -p game-core --test hostile_input
        env: { CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'true', CARGO_PROFILE_RELEASE_LTO: 'false', CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16' }

  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: taiki-e/install-action@wasm-pack
      - run: npm ci
      - name: Build wasm (the TypeScript types come from it)
        run: wasm-pack build ../crates/game-core --target web --release --no-opt --out-dir ../../web/src/wasm
      - run: npx tsc --noEmit
      - name: Known vulnerabilities in what ships to players
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Demo village test (deterministic core under node)
        run: |
          wasm-pack build ../crates/game-core --target nodejs --release --no-opt --out-dir ../../web/tests/.wasm
          node -e "require('fs').writeFileSync('tests/.wasm/package.json','{\"type\":\"commonjs\"}')"
          node --experimental-strip-types --test tests/demo.test.mjs tests/replay.test.mjs tests/opening.wasm.test.mjs tests/desync.test.mjs
      - run: npx vite build

  mcp:
    name: MCP server (tests, audit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: mcp/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - run: npm ci
      - name: Build the game core for Node (the server runs it in-process)
        run: npm run wasm
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  rust-audit:
    name: Rust dependencies (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
